[package]
# NOTE: The version is maintained in the release branch only, through semantic-release.
name = "senc"
version = "0.0.0-dev"
edition = "2021"
build = "build.rs"


[[bin]]
bench = false
path = "src/main.rs"
name = "senc"


[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
deno_core = "0.412.0"
deno_error = "=0.7.1"
env_logger = "0.11.11"
handlebars = "6.4.4"
jsonschema = "0.56.0"
lazy_static = "1.5.0"
log = "0.4.34"
path-clean = "1.0.1"
regex = "1.13.1"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"

[build-dependencies]
deno_core = "0.412.0"
